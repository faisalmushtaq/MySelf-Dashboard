name: Preview the dashboard

# The web app from the working branch, published to a Firebase Hosting PREVIEW
# CHANNEL of the dashboard site: its own URL, which expires, beside the live
# dashboard rather than instead of it. Only the static web app goes out — the
# functions, rules and database are the live ones, so the preview shows the
# real study to the same signed-in, role-checked people and changes nothing.
#
# The functions accept calls from this site's preview channels only because
# DASHBOARD_PREVIEW_SITE (apps/functions/.env.myself-research) names the site;
# see previewOrigins() in apps/functions/src/env.ts. A web change that needs a
# new or changed function has to be merged and deployed from main first.

on:
  push:
    branches: [claude/laughing-lovelace-9qt0j6]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dashboard-preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @myself-dashboard/core build
      - run: pnpm -r test
      - name: Credentials
        env:
          KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$KEY" ]; then echo "::error::FIREBASE_SERVICE_ACCOUNT is not set (docs/06-handover.md)"; exit 1; fi
          printf '%s' "$KEY" > "$RUNNER_TEMP/key.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/key.json" >> "$GITHUB_ENV"
      # The web app's public config (apiKey, projectId…). A build without it is a
      # dashboard that tells everyone "Not configured", which is what a deploy
      # with the DASHBOARD_FIREBASE_CONFIG variable unset published on 6 Oct
      # 2026. So it is read from the project when the variable is not set, and
      # checked before anything is published.
      - name: Web app config
        env:
          CONFIG: ${{ vars.DASHBOARD_FIREBASE_CONFIG }}
        run: |
          if [ -n "$CONFIG" ]; then
            echo "VITE_FIREBASE_CONFIG=$(node -e 'process.stdout.write(JSON.stringify(JSON.parse(process.env.CONFIG)))')" >> "$GITHUB_ENV"
          else
            node scripts/firebase-ops.mjs webconfig
          fi
      # The Hosting predeploy in firebase.json builds the web app, with that
      # config in its environment.
      - name: Publish to the preview channel
        run: |
          node -e 'const c = JSON.parse(process.env.VITE_FIREBASE_CONFIG || "{}"); if (!c.apiKey || !c.projectId) { console.log("::error::No web app config for the build: the dashboard would say Not configured. Nothing was published."); process.exit(1); }'
          pnpm exec firebase hosting:channel:deploy dashboard-preview --only dashboard \
            --expires 30d --project myself-research --non-interactive | tee channel.log
          url=$(grep -oE 'https://[a-z0-9-]+--dashboard-preview-[a-z0-9]+\.web\.app' channel.log | head -1)
          if [ -z "$url" ]; then echo "::error::Deployed, but no channel URL found in the output above."; exit 1; fi
          echo "Dashboard preview: $url"
          echo "### Dashboard preview: $url" >> "$GITHUB_STEP_SUMMARY"
      # The live functions are never deployed from here: a working branch is
      # unreviewed, and the functions serve the real study. They go out only
      # through the Deploy dashboard workflow, from main.
      - name: Remove credentials
        if: always()
        run: shred -u "$RUNNER_TEMP/key.json" 2>/dev/null || rm -f "$RUNNER_TEMP/key.json"
